name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, verified upstream revision
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Network-free Unix installer lifecycle tests
        if: runner.os == 'Linux'
        run: python3 tests/installers.py
      - name: Native CLI smoke
        shell: bash
        run: python tests/native_smoke.py target/debug/uncle-skills${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Interactive zsh completion
        if: runner.os == 'Linux'
        run: |
          command -v zsh >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y zsh; }
          python3 tests/zsh_completion.py target/debug/uncle-skills
      - name: Shell installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh
      - name: PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Write-Error; exit 1 }
